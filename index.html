*{box-sizing:border-box}
html,body{padding:0;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Cairo',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none;cursor:pointer}
button{font-family:inherit;cursor:pointer}
ul{list-style:none;margin:0;padding:0}
img{max-width:100%;display:block}
.container{max-width:1320px;margin:0 auto;padding:0 24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:600;padding:12px 20px;transition:.15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--navy-900);color:#fff}
.btn-primary:hover{background:var(--navy-700)}
.btn-outline{background:#fff;color:var(--navy-900);border:1px solid var(--border)}
.btn-outline:hover{background:var(--slate-bg)}
.btn-danger-outline{background:#fff;color:var(--red);border:1px solid #f3c9c5}
.btn-danger-outline:hover{background:var(--red-bg)}
.btn-block{width:100%}
.btn-sm{padding:8px 14px;font-size:13px}
.site-header{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40}
.site-header .container{display:flex;align-items:center;justify-content:space-between;height:84px}
.brand{display:flex;align-items:center;gap:12px}
.brand-title{font-size:20px;font-weight:800;color:var(--navy-900);line-height:1.2}
.brand-sub{font-size:12px;color:var(--text-muted);font-weight:500}
.header-actions{display:flex;align-items:center;gap:12px}
.lang-pill{display:flex;background:var(--slate-bg);border-radius:999px;padding:4px;gap:4px}
.lang-pill button{border:none;background:transparent;padding:8px 18px;border-radius:999px;font-size:14px;font-weight:600;color:var(--text-muted)}
.lang-pill button.active{background:var(--navy-900);color:#fff}
.user-chip{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 14px;border-radius:999px;border:1px solid var(--border);background:#fff;cursor:pointer}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--slate-bg);color:var(--navy-800);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.user-chip .user-name{font-size:14px;font-weight:600;color:var(--navy-900)}
.acct-menu-wrap{position:relative}
.acct-menu{position:absolute;top:calc(100% + 8px);left:0;min-width:220px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 28px rgba(15,23,42,.14);padding:8px;z-index:60}
.acct-menu-head{padding:10px 12px 12px;border-bottom:1px solid var(--border);margin-bottom:6px}
.acct-menu-head .user-name{font-size:14px;font-weight:700;color:var(--navy-900)}
.acct-menu-email{font-size:12px;color:var(--text-muted);margin-top:2px;word-break:break-all}
.acct-menu-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--navy-800);width:100%;text-align:right;background:transparent;border:none;cursor:pointer}
.acct-menu-item:hover{background:var(--slate-bg)}
.hero{margin-top:28px;border-radius:var(--radius-lg);background:linear-gradient(120deg,#dfe9f7 0%,#f2e3da 55%,#fbe9e2 100%);overflow:hidden;padding:56px 48px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.service-select-bar{margin-top:20px;border-radius:var(--radius-lg);background:linear-gradient(120deg,#dfe9f7 0%,#f2e3da 55%,#fbe9e2 100%);padding:14px 28px}
.service-select-bar h2{font-size:17px;font-weight:800;color:var(--navy-900);margin:0 0 3px}
.service-select-bar p{font-size:12.5px;color:var(--navy-700);opacity:.85;margin:0}
.about-section{margin-top:28px;border-radius:var(--radius-lg);background:linear-gradient(120deg,#dfe9f7 0%,#f2e3da 55%,#fbe9e2 100%);overflow:hidden;padding:56px 48px;display:flex;align-items:center;justify-content:space-between;gap:32px}
.about-section .about-copy{flex:1;min-width:0}
.about-section .hero-art{width:260px}
.about-section h2{font-size:30px;font-weight:800;color:var(--navy-900);margin:0 0 18px}
.about-section p{font-size:15.5px;color:var(--navy-700);line-height:2;margin:0 0 12px;max-width:820px;opacity:.9}
.about-section p:last-child{margin-bottom:0}
.hero-copy h1{font-size:34px;font-weight:800;color:var(--navy-900);margin:0 0 14px}
.hero-copy p{font-size:16px;color:var(--navy-700);line-height:1.9;max-width:420px;margin:0;opacity:.85}
.hero-art{flex-shrink:0;width:320px;max-width:40%}
.service-grid{margin-top:28px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.service-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;transition:.2s}
.service-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.service-icon{width:76px;height:76px;border-radius:50%;background:var(--slate-bg);color:var(--navy-800);display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.service-card h3{font-size:17px;font-weight:700;color:var(--navy-900);margin:0 0 8px}
.service-card p{font-size:13.5px;color:var(--text-muted);line-height:1.7;margin:0 0 22px;min-height:44px}
.site-footer{margin-top:40px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:32px}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;padding:36px 40px}
.footer-col h4{font-size:15px;font-weight:700;color:var(--navy-900);margin:0 0 18px}
.footer-row{display:flex;align-items:center;gap:10px;color:var(--text-muted);font-size:14px;margin-bottom:14px;direction:ltr;justify-content:flex-end}
.footer-row svg{color:var(--navy-800);flex-shrink:0}
.social-row{display:flex;gap:10px}
.social-row a{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--navy-800);font-size:13px;font-weight:700}
.footer-about p{font-size:13.5px;color:var(--text-muted);line-height:1.9;margin:0}
.footer-logo{display:flex;flex-direction:column;align-items:center;gap:10px;justify-self:end}
.footer-logo .brand-title{font-size:16px}
.page-top{display:flex;align-items:center;justify-content:space-between;margin:28px 0 20px}
.back-link{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);padding:10px 18px;border-radius:var(--radius-sm);font-weight:600;font-size:14px;color:var(--navy-900)}
.crumbs{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-muted);font-weight:500}
.crumbs .current{color:var(--navy-900);font-weight:700}
.page-heading{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.page-heading h1{font-size:24px;font-weight:800;color:var(--navy-900);margin:0}
.icon-badge{width:40px;height:40px;border-radius:var(--radius-sm);background:var(--slate-bg);color:var(--navy-800);display:flex;align-items:center;justify-content:center}
.page-sub{color:var(--text-muted);font-size:14px;margin:4px 0 0}
.detail-layout{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start;margin-bottom:40px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px}
.tabs-row{display:flex;gap:6px;background:var(--slate-bg);padding:6px;border-radius:var(--radius-md);margin-bottom:20px;width:fit-content}
.tabs-row button{border:none;background:transparent;padding:9px 18px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:600;color:var(--text-muted)}
.tabs-row button.active{background:#fff;color:var(--navy-900);box-shadow:var(--shadow-sm)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:999px}
.badge-slate{background:var(--slate-bg);color:var(--text-muted)}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 24px;color:var(--text-muted)}
.empty-icon{width:68px;height:68px;border-radius:50%;background:var(--slate-bg);color:var(--text-faint);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.empty-state h3{font-size:16px;font-weight:700;color:var(--navy-900);margin:0 0 6px}
.empty-state p{font-size:13.5px;margin:0 0 20px;max-width:320px;line-height:1.8}
.summary-card h3{font-size:16px;font-weight:700;color:var(--navy-900);margin:0 0 18px}
.summary-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.summary-row:last-of-type{border-bottom:none}
.summary-row .label{color:var(--text-muted)}
.summary-row .value{font-weight:700;color:var(--navy-900)}
.support-card{margin-top:16px;display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px}
.support-card .icon-badge{width:44px;height:44px;border-radius:50%;background:var(--navy-900);color:#fff}
.support-card h4{font-size:14.5px;font-weight:700;margin:0 0 3px;color:var(--navy-900)}
.support-card p{font-size:12.5px;color:var(--text-muted);margin:0}
.entry-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 20%,#eef3fb 0%,var(--bg) 55%);padding:24px}
.entry-box{width:100%;max-width:880px;text-align:center}
.entry-box .brand{justify-content:center;margin-bottom:28px}
.entry-box h1{font-size:28px;font-weight:800;color:var(--navy-900);margin:0 0 10px}
.entry-box>p{color:var(--text-muted);font-size:15px;margin:0 0 40px}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.role-card{display:block;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:40px 28px;text-align:center;transition:.2s}
.role-card:hover{box-shadow:var(--shadow-md);transform:translateY(-3px);border-color:var(--navy-600)}
.role-card .service-icon{width:88px;height:88px;margin:0 auto 22px}
.role-card h2{font-size:19px;font-weight:800;color:var(--navy-900);margin:0 0 10px}
.role-card p{font-size:13.5px;color:var(--text-muted);line-height:1.8;margin:0 0 26px}
.entry-note{margin-top:32px;font-size:12.5px;color:var(--text-faint)}
.app-shell{display:flex;min-height:100vh}
.sidebar{width:240px;flex-shrink:0;background:var(--navy-900);color:#cdd7ea;padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar .brand{padding:6px 10px 22px}
.sidebar .brand-title{color:#fff;font-size:16px}
.sidebar .brand-sub{color:#92a1c2}
.sidebar nav{flex:1;display:flex;flex-direction:column;gap:4px}
.sidebar nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;color:#b9c4dd}
.sidebar nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.sidebar nav a.active{background:#fff;color:var(--navy-900)}
.sidebar-footer{border-top:1px solid rgba(255,255,255,.1);padding-top:12px}
.sidebar-footer a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;color:#b9c4dd}
.sidebar-footer a:hover{background:rgba(255,255,255,.06);color:#fff}
.main-area{flex:1;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--border);height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:30}
.topbar-icons{display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--navy-800)}
.topbar .user-role{font-size:12px;color:var(--text-muted);font-weight:500}
.page-body{padding:28px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px 24px}
.stat-value{font-size:30px;font-weight:800;color:var(--navy-900)}
.stat-label{font-size:13.5px;color:var(--text-muted);margin-top:6px;font-weight:600}
.panel-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px}
.panel h3{font-size:15.5px;font-weight:700;color:var(--navy-900);margin:0 0 18px}
.ring-placeholder{width:150px;height:150px;border-radius:50%;border:18px solid var(--slate-bg);margin:12px auto 18px;display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:12.5px;font-weight:600;text-align:center}
.filter-bar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.filter-select{border:1px solid var(--border);background:#fff;border-radius:var(--radius-sm);padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--text-muted);display:flex;align-items:center;gap:8px}
.search-box{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:#fff;border-radius:var(--radius-sm);padding:10px 14px;color:var(--text-faint);font-size:13.5px}
.search-box input{border:none;outline:none;flex:1;font-size:13.5px;font-family:inherit;background:transparent;color:var(--text)}
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--slate-bg)}
th{text-align:right;font-size:13px;font-weight:700;color:var(--text-muted);padding:14px 20px}
td{padding:16px 20px;font-size:13.5px;border-top:1px solid var(--border);color:var(--text)}
.table-empty td{text-align:center;padding:56px 20px;color:var(--text-muted)}
.field{display:block;font-size:13px;font-weight:600;color:var(--text-muted)}
.field input{display:block;width:100%;margin-top:8px;padding:11px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);font-family:inherit;font-size:13.5px;color:var(--text);background:#fbfcfe}
.avatar-upload{width:100px;height:100px;border-radius:50%;background:var(--slate-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;color:var(--text-faint)}
.auth-card{max-width:460px;margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:36px 32px;text-align:center}
.auth-card h1{font-size:22px;font-weight:800;color:var(--navy-900);margin:0 0 8px}
.auth-card>p{color:var(--text-muted);font-size:14px;margin:0 0 28px}
.guest-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border-radius:var(--radius-md);border:1.5px dashed var(--navy-600);background:var(--slate-bg);color:var(--navy-900);font-weight:700;font-size:14.5px;margin-bottom:20px}
.guest-btn:hover{background:#e4e9f3}
.divider-row{display:flex;align-items:center;gap:12px;color:var(--text-faint);font-size:12.5px;font-weight:600;margin:8px 0 20px}
.divider-row::before,.divider-row::after{content:"";flex:1;height:1px;background:var(--border)}
.auth-actions{display:flex;flex-direction:column;gap:12px}
.auth-switch{margin-top:24px;font-size:13.5px;color:var(--text-muted)}
.auth-switch a{color:var(--navy-800);font-weight:700}
.form-field{display:block;text-align:start;margin-bottom:16px}
.form-field label{display:block;font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:8px}
.form-field input,.form-field select{display:block;width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);font-family:inherit;font-size:14px;color:var(--text);background:#fbfcfe}
.form-field input:focus,.form-field select:focus{outline:none;border-color:var(--navy-600)}
.date-select-row{display:flex;gap:8px}
.date-select-row select{flex:1;min-width:0;padding:12px 8px;border-radius:var(--radius-sm);border:1px solid var(--border);font-family:inherit;font-size:13.5px;color:var(--text);background:#fbfcfe}
.date-select-row select:focus{outline:none;border-color:var(--navy-600)}
.form-field .file-field{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1px dashed var(--border);background:#fbfcfe;cursor:pointer;font-size:13px;color:var(--text-muted)}
.form-field .file-field:hover{border-color:var(--navy-600);color:var(--navy-800)}
.form-field .file-field input[type="file"]{display:none}
.form-field .file-field .file-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.form-field .file-hint{display:block;font-size:11.5px;color:var(--text-faint);margin-top:6px}
.field-error{display:block;color:var(--red);font-size:12px;margin:-8px 0 16px;font-weight:600;text-align:start}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.form-field.full{grid-column:1/-1}
.code-hint{background:var(--amber-bg);color:var(--amber);border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;font-weight:600;margin-bottom:20px;text-align:center}
.guest-tag{background:var(--amber-bg);color:var(--amber);font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px}
.stepper{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:30px}
.stepper .step-dot{width:32px;height:32px;border-radius:50%;background:var(--slate-bg);color:var(--text-faint);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.stepper .step-dot.active{background:var(--navy-900);color:#fff}
.stepper .step-dot.done{background:var(--green);color:#fff}
.stepper .step-line{width:36px;height:2px;background:var(--border)}
.finder-box{max-width:640px;margin:0 auto;text-align:center}
.finder-box h2{font-size:21px;font-weight:800;color:var(--navy-900);margin:0 0 6px}
.finder-box>p{color:var(--text-muted);font-size:14px;margin:0 0 28px}
.tile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
.tile{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius-md);padding:16px 10px;font-size:13.5px;font-weight:700;color:var(--navy-900);text-align:center}
.tile:hover{border-color:var(--navy-600)}
.tile.selected{border-color:var(--navy-900);background:var(--navy-900);color:#fff}
.chip-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:28px}
.chip{padding:11px 20px;border-radius:999px;border:1.5px solid var(--border);background:#fff;font-size:13.5px;font-weight:700;color:var(--navy-900)}
.chip:hover{border-color:var(--navy-600)}
.chip.active{background:var(--navy-900);border-color:var(--navy-900);color:#fff}
.pref-hint{font-size:12.5px;color:var(--text-faint);font-weight:600;margin:-18px 0 22px}
.pref-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px;text-align:start}
.pref-tile{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius-md);padding:18px 16px;transition:.15s;position:relative}
.pref-tile:hover{border-color:var(--navy-600)}
.pref-tile.active{border-color:var(--navy-900);background:var(--navy-900)}
.pref-tile h4{margin:0 0 5px;font-size:14.5px;font-weight:700;color:var(--navy-900);display:flex;align-items:center;gap:8px}
.pref-tile.active h4{color:#fff}
.pref-tile p{margin:0;font-size:12px;color:var(--text-muted);line-height:1.6}
.pref-tile.active p{color:#c9d3e8}
.pref-check{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px}
.pref-tile.active .pref-check{background:#fff;border-color:#fff;color:var(--navy-900)}
.result-highlights{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:6px}
.result-highlights li{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--text-muted);line-height:1.6}
.result-highlights li svg{flex-shrink:0;margin-top:2px;color:var(--green)}
@media (max-width:720px){.pref-grid{grid-template-columns:1fr 1fr}}
.finder-footer{display:flex;gap:12px;justify-content:center}
.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:8px}
.result-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;text-align:start}

let otpStatus = 'idle'; // idle | sending | sent | error
function sendOtpEmail(email, code){
  otpStatus = 'sending';
  try{
    if(!window.emailjs){ otpStatus = 'error'; route(); return; }
    const expiry = new Date(Date.now() + 15*60*1000);
    const timeStr = expiry.toLocaleTimeString('ar-SA', {hour:'2-digit',minute:'2-digit'});
    emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, { email, passcode: code, time: timeStr })

}

/* Shows the attached file name (if the employee response included one) */
function attachmentLine(r){
  const name = r && r.employeeResponse && r.employeeResponse.attachment;
  if(!name) return "";
  return `<div class="footer-row" style="direction:rtl;justify-content:flex-start;margin:8px 0 0;font-size:13px">${I('paperclip',15)}<span>${name}</span></div>`;
}

/* Locale-proof date field — three plain selects (day/month/year) instead of the native
   <input type="date">, whose placeholder text/order is controlled by the device's OS locale
   and can render garbled on some phones no matter what CSS/lang is set on the page.
   kind: 'past' (birth dates), 'future' (travel dates), 'flex' (expiry dates, past or future) */
function dateField(id, label, value, kind, extraAttrs){
  extraAttrs = extraAttrs || "";
  const curY = new Date().getFullYear();
  let yFrom, yTo;
  if(kind==='past'){ yFrom = curY-100; yTo = curY; }
  else if(kind==='future'){ yFrom = curY; yTo = curY+2; }
  else { yFrom = curY-15; yTo = curY+15; }
  let vy="", vm="", vd="";
  if(value && /^\d{4}-\d{2}-\d{2}$/.test(value)){
    const p = value.split('-');
    vy = String(Number(p[0])); vm = String(Number(p[1])); vd = String(Number(p[2]));
  }
  const months = L(["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"],["January","February","March","April","May","June","July","August","September","October","November","December"]);
  const dayOpts = [`<option value="">${L('يوم','Day')}</option>`].concat(
    Array.from({length:31},(_,i)=>i+1).map(d=>`<option value="${d}" ${String(d)===vd?'selected':''}>${d}</option>`)
  ).join("");
  const monthOpts = [`<option value="">${L('شهر','Month')}</option>`].concat(
    months.map((m,i)=>`<option value="${i+1}" ${String(i+1)===vm?'selected':''}>${m}</option>`)
  ).join("");
  const years = [];
  if(kind==='past'){ for(let y=yTo;y>=yFrom;y--) years.push(y); } else { for(let y=yFrom;y<=yTo;y++) years.push(y); }
  const yearOpts = [`<option value="">${L('سنة','Year')}</option>`].concat(
    years.map(y=>`<option value="${y}" ${String(y)===vy?'selected':''}>${y}</option>`)
  ).join("");
  return `<div class="form-field">
    <label for="${id}-day">${label}</label>
    <div class="date-select-row" data-date-group="${id}">
      <select class="date-part" data-date-part="day" data-for="${id}" id="${id}-day">${dayOpts}</select>
      <select class="date-part" data-date-part="month" data-for="${id}" id="${id}-month">${monthOpts}</select>
      <select class="date-part" data-date-part="year" data-for="${id}" id="${id}-year">${yearOpts}</select>
    </div>
    <input type="hidden" id="${id}" ${extraAttrs} value="${value||''}"/>
  </div>`;
}

/* Reusable upload control — accepts PDF or image files (e.g. passport/ID copies, offer documents) */
function fileField(id, label, hint){
  const current = (window.uploadedFiles && window.uploadedFiles[id]) || "";
  return `<div class="form-field full">
    <label for="${id}">${label}</label>

let employeeSession = null; // {email, full_name, role} once verified against the employees table

async function checkEmployeeSession(){
  /* Restores whichever kind of session (staff or customer) is currently held by Supabase Auth.
     Both roles now share the same auth.users table — the ONLY thing that distinguishes a staff
     account is a matching row in `employees`. Everyone else with a valid session is treated as
     a signed-in customer (their profile is fetched from `profiles`). Nobody is force-signed-out
     just for being a customer — that used to be a bug when this function only knew about staff. */
  employeeAccessGranted = false;
  employeeSession = null;
  if(!supabaseClient){ employeeAuthChecked = true; return; }
  try{
    const { data:{ session } } = await supabaseClient.auth.getSession();
    if(session && session.user && session.user.email){
      const email = session.user.email.toLowerCase();
      const { data, error } = await supabaseClient
        .from('employees')
        .select('email, full_name, role')
        .eq('email', email)
        .maybeSingle();
      if(!error && data){
        employeeSession = data;
        employeeAccessGranted = true;
      } else {
        // Not staff — see if it's a customer account with a profile row.
        const { data: profile } = await supabaseClient
          .from('profiles').select('*').eq('email', email).maybeSingle();
        if(profile){
          authState = { mode:'user', user:{ firstName:profile.first_name, lastName:profile.last_name, email:profile.email, nationality:profile.nationality } };
        } else {
          // Signed in with Supabase but neither staff nor a known customer profile — treat as signed out.
          await supabaseClient.auth.signOut();
        }
      }
    }
  }catch(e){ /* leave access denied on any failure */ }
  employeeAuthChecked = true;
  await refreshAppDataCaches();
}

    return {type:"multi",

             `A Schengen-area destination — a single Schengen visa lets you visit 25+ European countries besides ${dest.nameEn||dest.name}`)};
  }
  const isGcc = GCC_SET.has(nationality);
  const text = L(isGcc ? dest.visaGcc : dest.visaDefault, isGcc ? (dest.visaGccEn||dest.visaGcc) : (dest.visaDefaultEn||dest.visaDefault));
  const arText = isGcc ? dest.visaGcc : dest.visaDefault;
  const type = /بدون تأشيرة|مجانية/.test(arText) ? "free" : "visa";
  return {type,text};
}
function matchDestinations(){
  const {prefs,time} = finderState;
  const scored = DESTINATIONS.map(d=>{
    let score = 0;
    prefs.forEach(p=>{ if(d.tags.includes(p)) score += 2; });
    if(time && d.times.includes(time)) score += 1;
    return {d,score};
  });
  scored.sort((a,b)=>b.score-a.score);
  return scored.map(s=>s.d);
}

const STATUS_LABEL = {
  pending:"قيد المراجعة", responded:"بانتظار موافقتك", confirmed:"مؤكد ومدفوع", cancelled:"ملغي"
};
const STATUS_LABEL_EN = {
  pending:"Under review", responded:"Awaiting your approval", confirmed:"Confirmed & paid", cancelled:"Cancelled"
};
const STATUS_CLASS = {
  pending:"status-pending", responded:"status-responded", confirmed:"status-confirmed", cancelled:"status-cancelled"
};

// Aviation-standard age bands used for traveler classification on flight bookings:
// Infant: under 2 years — Child: 2 up to (not including) 12 years — Adult: 12 years and older
function computeYearsOld(birthDateStr){
  const dob = new Date(birthDateStr);
  if(!birthDateStr || isNaN(dob.getTime())) return null;
  const now = new Date();
  let years = now.getFullYear() - dob.getFullYear();
  const m = now.getMonth() - dob.getMonth();
  if(m < 0 || (m === 0 && now.getDate() < dob.getDate())) years--;
  return years >= 0 ? years : null;
}
function ageCategory(birthDateStr){
  const years = computeYearsOld(birthDateStr);
  if(years===null) return null;
  if(years < 2) return {key:'infant',label:L('رضيع (أقل من سنتين)','Infant (under 2 years)')};
  if(years < 12) return {key:'child',label:L('طفل (من سنتين إلى أقل من 12 سنة)','Child (2 to under 12 years)')};
  return {key:'adult',label:L('بالغ (12 سنة فأكثر)','Adult (12 years and older)')};
}
function licenseAgeNote(birthDate){
  const years = computeYearsOld(birthDate);
  if(years===null) return L('الرجاء إدخال تاريخ ميلاد صحيح','Please enter a valid date of birth');

/* ---------------- Requests: in-memory cache backed by Supabase (shared across devices/users) ----------------
   Reads stay perfectly synchronous (nothing else in the app has to change), while every write is
   mirrored to Supabase in the background. `refreshRequestsCache()` re-pulls from Supabase and is
   called on boot and after login/logout so the cache always reflects what the signed-in account
   is allowed to see under Row Level Security. */
let _requestsCache = [];
function getAllRequests(){ return _requestsCache; }
async function refreshRequestsCache(){
  if(!supabaseClient){ return; }
  let query = supabaseClient.from('requests').select('*').order('created_at', {ascending:false});
  if(employeeAccessGranted){
    // employees see every request (allowed by RLS policy for the employees table)
  } else if(authState.mode==='user' && authState.user){
    query = query.eq('customer_email', authState.user.email.toLowerCase());
  } else {
    _requestsCache = [];
    return;
  }
  const { data, error } = await query;
  if(!error && data) _requestsCache = data.map(rowToRequest);
}
function rowToRequest(row){
  return Object.assign({}, row.payload||{}, {
    id: row.id, type: row.type, status: row.status, customerEmail: row.customer_email,
    customerName: row.customer_name, createdAt: row.created_at, employeeResponse: row.employee_response||null
  });
}
function requestToRow(req){
  const { id, type, status, customerEmail, customerName, createdAt, employeeResponse, ...rest } = req;
  return {
    id, type, status, customer_email: (customerEmail||'').toLowerCase(), customer_name: customerName||'',
    created_at: createdAt || new Date().toISOString(), employee_response: employeeResponse||null, payload: rest
  };
}
function addRequest(req){
  _requestsCache.unshift(req);
  if(supabaseClient){
    supabaseClient.from('requests').insert(requestToRow(req)).then(({error})=>{
      if(error){ console.error('addRequest failed to sync to Supabase:', error); }
    });
  }
  return req;
}
function updateRequestById(id, patch){
  const idx = _requestsCache.findIndex(r=>r.id===id);
  if(idx===-1) return null;
  _requestsCache[idx] = Object.assign({}, _requestsCache[idx], patch);
  if(supabaseClient){
    const row = requestToRow(_requestsCache[idx]);
    supabaseClient.from('requests').update({
      status: row.status, employee_response: row.employee_response, payload: row.payload
    }).eq('id', id).then(({error})=>{
      if(error) console.error('updateRequestById failed to sync to Supabase:', error);
    });
  }
  return _requestsCache[idx];
}

function donutChart(segments, size){
  size = size || 150;
  const total = segments.reduce((s,x)=>s+x.value,0);
  if(!total) return `<div class="ring-placeholder">لا توجد بيانات بعد</div>`;
  let acc = 0;
  const stops = segments.map(s=>{
    const start = acc/total*360; acc += s.value; const end = acc/total*360;
    return `${s.color} ${start}deg ${end}deg`;
  }).join(", ");
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:conic-gradient(${stops});margin:12px auto 18px;display:flex;align-items:center;justify-content:center">
    <div style="width:${Math.round(size*0.62)}px;height:${Math.round(size*0.62)}px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div style="font-size:22px;font-weight:800;color:var(--navy-900)">${total}</div>
      <div style="font-size:11px;color:var(--text-muted);font-weight:600">الإجمالي</div>
    </div>
  </div>
  <div class="donut-legend">${segments.map(s=>`<div class="legend-row"><span class="legend-dot" style="background:${s.color}"></span><span class="legend-label">${s.label}</span><span class="legend-value">${s.value}</span></div>`).join("")}</div>`;
}
function barChart(bars){
  const max = Math.max(1, ...bars.map(b=>b.value));
  return `<div class="bar-chart">${bars.map(b=>`
    <div class="bar-col">
      <div class="bar-track"><div class="bar-fill" style="height:${Math.round(b.value/max*100)}%"></div></div>
      <div class="bar-value">${b.value}</div>
      <div class="bar-label">${b.label}</div>
    </div>`).join("")}</div>`;
}

function collectBookingDraftFromDOM(){
  if(!requestDraft) return;
  const d = requestDraft;
  const g = id => { const el = document.getElementById(id); return el ? el.value : undefined; };
  if(g('bk-destination')!==undefined) d.destination = g('bk-destination');
  if(g('bk-departure-city')!==undefined) d.departureCity = g('bk-departure-city');
  if(g('bk-depart-date')!==undefined) d.departDate = g('bk-depart-date');
  if(g('bk-return-date')!==undefined) d.returnDate = g('bk-return-date');
  if(g('bk-notes')!==undefined) d.notes = g('bk-notes');
  const count = d.travelerCount || 1;
  d.travelers = d.travelers || [];
  for(let i=0;i<count;i++){
    const name = g(`trav-${i}-name`), nat = g(`trav-${i}-nat`), dob = g(`trav-${i}-dob`), docId = g(`trav-${i}-id`);
    if(name!==undefined || nat!==undefined || dob!==undefined || docId!==undefined){
      const prev = d.travelers[i] || {};
      d.travelers[i] = {
        fullName: name!==undefined?name:prev.fullName||'',
        nationality: nat!==undefined?nat:prev.nationality||'',
        birthDate: dob!==undefined?dob:prev.birthDate||'',
        docId: docId!==undefined?docId:prev.docId||''
      };
    }
  }
}

function natLabelFor(arValue){
  if(!arValue) return arValue;
  const match = NATIONALITIES.find(n=>n.ar===arValue);
  return L(arValue, match ? match.en : arValue);
}

function serviceTypeLabelFor(arValue){
  if(!arValue) return arValue;

}

function collectOfferDraftFromDOM(){

  offerDraft = {
    title: g('offer-title') !== undefined ? g('offer-title') : prev.title,

    type: g('offer-type-percent') && document.getElementById('offer-type-percent').checked ? 'percent'

        : g('offer-type-bogo') && document.getElementById('offer-type-bogo').checked ? 'bogo'
        : g('offer-type-custom') && document.getElementById('offer-type-custom').checked ? 'custom'
        : prev.type,
    value: g('offer-value') !== undefined ? g('offer-value') : prev.value,
    customBadge: g('offer-custom-badge') !== undefined ? g('offer-custom-badge') : prev.customBadge,
    startDate: g('offer-start') !== undefined ? g('offer-start') : prev.startDate,
    endDate: g('offer-end') !== undefined ? g('offer-end') : prev.endDate,
    active: activeEl ? activeEl.checked : prev.active,
    image: prev.image || ""

/* ---------------- Router ---------------- */
function route(){
  const hash = location.hash.replace(/^#/,'') || '/';
  const parts = hash.split('/').filter(Boolean);
  const app = document.getElementById('app');
  if(parts[0]==='customer'){
    const p1 = parts[1];
    if(!p1){
      app.innerHTML = authState.mode ? pageCustomerHome() : pageCustomerAuth();
    } else if(p1==='login'){
      app.innerHTML = pageCustomerLogin();
    } else if(p1==='register'){
      app.innerHTML = pageCustomerRegister();
    } else if(p1==='verify'){
      app.innerHTML = pageCustomerVerify();
    } else if(p1==='logout'){
      authState = {mode:null,user:null};
      acctMenuOpen = false;
      _requestsCache = []; _ticketsCache = [];
      if(supabaseClient) supabaseClient.auth.signOut();
      location.hash = '#/customer';
      return;
    } else if(p1==='switch-account'){
      authState = {mode:null,user:null};
      acctMenuOpen = false;
      _requestsCache = []; _ticketsCache = [];
      if(supabaseClient) supabaseClient.auth.signOut();
      location.hash = '#/customer/login';
      return;
    } else if(p1==='destination-finder'){
      const step = parts[2];
      if(step==='result') app.innerHTML = pageFinderResult();
      else if(step==='2') app.innerHTML = pageFinderStep2();
      else if(step==='3') app.innerHTML = pageFinderStep3();
      else { finderState = {nationality:null,prefs:[],time:null}; app.innerHTML = pageFinderStep1(); }
    } else if(p1==='support'){
      if(authState.mode!=='user'){ app.innerHTML = pageCustomerGate('support'); }
      else { app.innerHTML = pageCustomerSupport(parts[2]); }
    } else if(p1==='gate' && parts[2]){
      if(authState.mode==='user'){ location.hash = `#/customer/service/${parts[2]}`; return; }
      app.innerHTML = pageCustomerGate(parts[2]);
    } else if(p1==='service' && parts[2]){
      if(authState.mode!=='user'){ location.hash = `#/customer/gate/${parts[2]}`; return; }
      app.innerHTML = pageCustomerService(parts[2], parts[3]);
    } else {
      app.innerHTML = authState.mode ? pageCustomerHome() : pageCustomerAuth();
    }
  } else if(parts[0]==='employee'){
    if(parts[1]==='logout'){
      employeeAccessGranted = false;
      employeeSession = null;
      acctMenuOpen = false;
      if(supabaseClient) supabaseClient.auth.signOut();
      location.hash = '#/customer';
      return;
    } else if(!employeeAuthChecked){
      app.innerHTML = `<main class="entry-screen"><div class="entry-box"><p>جارٍ التحقق من الجلسة...</p></div></main>`;
    } else if(!employeeAccessGranted){
      /* No separate "employee" URL/login form — staff sign in through the
         same customer login page. Access is decided purely by whether the
         signed-in account is a verified row in the `employees` table. */
      location.hash = '#/customer/login';
      return;
    }
    else { app.innerHTML = employeeShell(parts[1] || 'home', parts[2]); }
  } else {
    location.hash = '#/customer';
    return;
  }
  window.scrollTo(0,0);
}

function isValidEmail(v){
  return /^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}$/.test(v);
}
/* Looks up a customer's PROFILE only (never a password — Supabase Auth is the sole holder of
   credentials). Used to check "does this email already have an account" during login/registration. */
async function getStoredUser(email){
  if(!supabaseClient) return null;
  const { data, error } = await supabaseClient.from('profiles').select('*').eq('email', email.toLowerCase()).maybeSingle();
  if(error || !data) return null;
  return { firstName:data.first_name, lastName:data.last_name, email:data.email, nationality:data.nationality, createdAt:data.created_at };
}
/* Creates the real Supabase Auth account (password lives only inside Supabase) and the matching
   profile row. Called once the OTP step has been confirmed. */
async function createStoredUser({firstName, lastName, email, nationality, password}){
  if(!supabaseClient) throw new Error('no supabase client');
  const { data, error } = await supabaseClient.auth.signUp({ email, password });
  if(error) throw error;
  const userId = data && data.user && data.user.id;
  const { error: profileErr } = await supabaseClient.from('profiles').insert({
    id: userId, email: email.toLowerCase(), first_name: firstName, last_name: lastName, nationality
  });
  if(profileErr) throw profileErr;
}

    collectBookingDraftFromDOM();

    if(!d.destination || !d.departureCity || !d.departDate){ requestFormError = "الرجاء تعبئة تفاصيل الرحلة كاملة"; route(); return; }
    if(d.tripType==='roundtrip' && !d.returnDate){ requestFormError = "الرجاء تحديد تاريخ العودة"; route(); return; }
    const count = d.travelerCount || 1;
    const travelers = d.travelers || [];
    for(let i=0;i<count;i++){
      const t = travelers[i];
      if(!t || !t.fullName || !t.nationality || !t.birthDate || !t.docId){ requestFormError = `الرجاء تعبئة كل بيانات المسافر رقم ${i+1}`; route(); return; }
      if(!ageCategory(t.birthDate)){ requestFormError = `تاريخ ميلاد المسافر رقم ${i+1} غير صحيح`; route(); return; }
    }
    const travelersWithCategory = travelers.slice(0,count).map(t=>{
      const cat = ageCategory(t.birthDate);
      return Object.assign({}, t, {ageCategory: cat.key, ageLabel: cat.label});
    });
    const req = {
      id: genRequestId(), type:'booking', status:'pending', createdAt: new Date().toISOString(),

      tripType: d.tripType, destination: d.destination, departureCity: d.departureCity,
      departDate: d.departDate, returnDate: d.tripType==='roundtrip'?d.returnDate:null,
      travelers: travelersWithCategory, notes: d.notes||''

    requestDraft = null; requestFormError = "";

    return;
  }

  /* ---- License request submit ---- */
  const submitLicense = e.target.closest('[data-action="submit-request-license"]');
  if(submitLicense){
    const g = id => { const el=document.getElementById(id); return el?el.value:''; };
    const fullName=g('lic-name'), nationality=g('lic-nat'), birthDate=g('lic-dob'), nationalId=g('lic-id'),
          currentLicenseNumber=g('lic-current-number'), currentLicenseExpiry=g('lic-current-expiry'),
          validityYears=g('lic-validity'), notes=g('lic-notes');
    if(!fullName||!nationality||!birthDate||!nationalId||!currentLicenseNumber){ requestFormError = "الرجاء تعبئة جميع الحقول المطلوبة"; route(); return; }
    if(!(window.uploadedFiles && window.uploadedFiles['lic-current-file'])){ requestFormError = "الرجاء إرفاق صورة الرخصة المحلية الحالية (PDF أو صورة)"; route(); return; }
    const years = computeYearsOld(birthDate);
    if(years===null){ requestFormError = "تاريخ الميلاد غير صحيح"; route(); return; }
    if(years<18){ requestFormError = "عذراً، رخصة القيادة الدولية تشترط أن يكون عمر المتقدم 18 سنة فأكثر"; route(); return; }
    const req = {
      id: genRequestId(), type:'license', status:'responded', createdAt: new Date().toISOString(),

      currentLicenseFile: window.uploadedFiles['lic-current-file'] || '',

        destination, people:Number(people)||1, date, budget, notes};

    } else {

  /* ---- Customer approves & pays / cancels ---- */

  if(approveBtn){
    const id = approveBtn.getAttribute('data-id');

      updateRequestById(id, {status:'confirmed', paymentStatus:'paid', ticketCode: genTicketCode(), confirmedAt: new Date().toISOString()});
      route();

  }
  const cancelReqBtn = e.target.closest('[data-action="cancel-request"]');
  if(cancelReqBtn){
    updateRequestById(cancelReqBtn.getAttribute('data-id'), {status:'cancelled'});

  }

  /* ---- Employee sends the final international license PDF (after payment) ---- */
  const sendLicenseBtn = e.target.closest('[data-action="send-license"]');
  if(sendLicenseBtn){
    const id = sendLicenseBtn.getAttribute('data-id');
    const licenseFile = (window.uploadedFiles && window.uploadedFiles['resp-license-file']) || "";
    if(!licenseFile){ requestFormError = "الرجاء رفع ملف الرخصة الدولية (PDF) قبل الإرسال"; route(); return; }
    const r = getRequestById(id);
    const resp = Object.assign({}, r.employeeResponse, {licenseFile, licenseSentAt:new Date().toISOString()});
    updateRequestById(id, {employeeResponse: resp});
    requestFormError = "";
    route();
    return;
  }

  /* ---- Customer "downloads" the issued license (demo — no real file storage) ---- */
  const downloadLicenseBtn = e.target.closest('[data-action="download-license"]');
  if(downloadLicenseBtn){
    e.preventDefault();
    alert('في بيئة تجريبية بدون خادم فعلي — سيتم استبدال هذا بتحميل فعلي لملف PDF عند ربط الموقع بخادم حقيقي.');
    return;
  }

  /* ---- Employee responds to a request ---- */
  const employeeRespondBtn = e.target.closest('[data-action="employee-respond"]');
  if(employeeRespondBtn){
    const id = employeeRespondBtn.getAttribute('data-id');
    const price = (document.getElementById('resp-price').value||'').trim();
    const details = (document.getElementById('resp-details').value||'').trim();
    if(!price || Number(price)<=0){ requestFormError = "الرجاء إدخال سعر إجمالي صحيح"; route(); return; }
    if(!details){ requestFormError = "الرجاء كتابة تفاصيل الحجز الكاملة قبل الإرسال"; route(); return; }

  /* ---- Support tickets: customer opens a new ticket ---- */
  const submitTicketBtn = e.target.closest('[data-action="submit-ticket"]');

    const subject = (document.getElementById('ticket-subject').value||'').trim();

    if(!message){ ticketFormError = "الرجاء كتابة تفاصيل المشكلة أو الاستفسار"; route(); return; }

      id: genTicketId(),

  /* ---- Support tickets: employee replies to the customer ---- */

      const messages = t.messages.concat([{from:'employee', text, at: now}]);

  /* ---- Reports: export a CSV of all requests ---- */

    if(!isValidEmail(email)){ err.innerHTML = `<p class="field-error">صيغة البريد الإلكتروني غير صحيحة</p>`; return; }
    err.innerHTML = "";
    const originalLabel = loginBtn.textContent;
    loginBtn.disabled = true; loginBtn.textContent = "جارٍ التحقق...";

    /* One shared login form and one shared auth.users table for everyone — staff and customers
       alike. Supabase Auth verifies the password (this app never sees or stores it). Afterwards
       we simply check which role the now-verified account has: a row in `employees` means staff,
       a row in `profiles` means a customer. No plaintext password is ever compared client-side. */
    if(!supabaseClient){
      loginBtn.disabled = false; loginBtn.textContent = originalLabel;
      err.innerHTML = `<p class="field-error">تعذّر الاتصال بالخادم، حاول مرة أخرى لاحقاً</p>`;

    if(!isValidEmail(email)){ err.innerHTML = `<p class="field-error">صيغة البريد الإلكتروني غير صحيحة</p>`; return; }
    if(pass !== pass2){ err.innerHTML = `<p class="field-error">كلمتا المرور غير متطابقتين</p>`; return; }
    if(pass.length < 6){ err.innerHTML = `<p class="field-error">كلمة المرور يجب ألا تقل عن 6 أحرف</p>`; return; }
    err.innerHTML = "";
    const originalLabel = regBtn.textContent;
    regBtn.disabled = true; regBtn.textContent = "جارٍ التحقق...";

    const code = String(Math.floor(1000 + Math.random()*9000));

  const resendBtn = e.target.closest('[data-action="resend-verify"]');

    verBtn.disabled = true; verBtn.textContent = "جارٍ إنشاء الحساب...";
    try{
      await createStoredUser(pendingSignup); // creates the real Supabase Auth user + profiles row
      const { error: signInErr } = await supabaseClient.auth.signInWithPassword({ email: pendingSignup.email, password: pendingSignup.password });
      if(signInErr) throw signInErr;
      await checkEmployeeSession();
    }catch(storageErr){
      verBtn.disabled = false; verBtn.textContent = originalLabel;
      err.innerHTML = `<p class="field-error">حدث خطأ أثناء إنشاء الحساب، حاول مرة أخرى</p>`;

  if(deleteOfferBtn){

  const toggleOfferBtn = e.target.closest('[data-action="toggle-offer-status"]');

    const off = getOffers().find(o=>o.id===toggleOfferBtn.getAttribute('data-id'));
    if(off){ updateOfferById(off.id, {active: !off.active}); route(); }
    return;
  }
  const removeOfferImgBtn = e.target.closest('[data-action="remove-offer-image"]');
  if(removeOfferImgBtn){
    collectOfferDraftFromDOM();
    offerDraft.image = "";
    route();
    return;
  }
  const saveOfferBtn = e.target.closest('[data-action="save-offer"]');
  if(saveOfferBtn){
    collectOfferDraftFromDOM();
    const d = offerDraft;
    if(!d.title || !d.title.trim()){ offerFormError = "الرجاء إدخال اسم العرض"; route(); return; }
    if((d.type==='percent'||d.type==='fixed') && (d.value===""||d.value===undefined||Number(d.value)<=0)){ offerFormError = "الرجاء إدخال قيمة خصم صحيحة"; route(); return; }
    if(d.type==='percent' && Number(d.value)>100){ offerFormError = "نسبة الخصم يجب ألا تتجاوز 100%"; route(); return; }
    if(d.type==='custom' && (!d.customBadge || !d.customBadge.trim())){ offerFormError = "الرجاء إدخال نص العرض"; route(); return; }
    if(d.startDate && d.endDate && d.endDate < d.startDate){ offerFormError = "تاريخ النهاية يجب أن يكون بعد تاريخ البداية"; route(); return; }
    const payload = {title:d.title.trim(),description:(d.description||"").trim(),type:d.type,value:d.value,customBadge:(d.customBadge||"").trim(),startDate:d.startDate||"",endDate:d.endDate||"",active:!!d.active,image:d.image||""};
    if(offerEditingId){
      updateOfferById(offerEditingId, payload);
    }else{
      addOffer(Object.assign({id:'off_'+Date.now()+Math.random().toString(36).slice(2,7),createdAt:new Date().toISOString()}, payload));
    }
    offerDraft = null; offerEditingId = null; offerFormError = "";
    route();
    return;
  }
});

window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', async function(){
  await checkEmployeeSession();
  route();
});

/* Offer type radios — toggle the relevant extra field in place, no re-render (keeps typed input) */
document.addEventListener('change', function(e){
  if(e.target.matches('input[name="offer-type"]')){
    const grid = e.target.closest('[data-offer-type-grid]');
    const form = grid ? grid.closest('.offer-form-card') : null;
    if(!form) return;
    const valueField = form.querySelector('[data-offer-field="value"]');
    const customField = form.querySelector('[data-offer-field="custom"]');
    const valueLabel = form.querySelector('label[for="offer-value"]');
    const v = e.target.value;
    if(valueField) valueField.style.display = (v==='percent'||v==='fixed') ? 'flex' : 'none';
    if(customField) customField.style.display = (v==='custom') ? 'flex' : 'none';
    if(valueLabel) valueLabel.textContent = v==='fixed' ? 'قيمة الخصم (ر.س)' : 'نسبة الخصم (%)';
    const valueInput = document.getElementById('offer-value');
    if(valueInput){ if(v==='percent') valueInput.setAttribute('max','100'); else valueInput.removeAttribute('max'); }
  }
});

/* Offer image upload — read as base64 so it can be stored and shown on the homepage */
document.addEventListener('change', function(e){
  if(e.target.matches('[data-offer-image-input]')){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      collectOfferDraftFromDOM();
      offerDraft.image = ev.target.result;
      route();
    };
    reader.readAsDataURL(file);
  }
});

/* Custom date fields — combine day/month/year selects into a hidden yyyy-mm-dd value */
document.addEventListener('change', function(e){
  if(e.target.matches('.date-part')){
    const id = e.target.getAttribute('data-for');
    const dayEl = document.getElementById(id+'-day'), monthEl = document.getElementById(id+'-month'), yearEl = document.getElementById(id+'-year');
    const hidden = document.getElementById(id);
    if(!dayEl || !monthEl || !yearEl || !hidden) return;
    const day = dayEl.value, month = monthEl.value, year = yearEl.value;
    if(day && month && year){
      const pad = n => String(n).padStart(2,'0');
      hidden.value = `${year}-${pad(month)}-${pad(day)}`;
    } else {
      hidden.value = "";
    }
    hidden.dispatchEvent(new Event('input', {bubbles:true}));
  }
});

/* File uploads (ID/passport copies, employee reply attachments) — demo only, no real backend to send to */
window.uploadedFiles = window.uploadedFiles || {};
document.addEventListener('change', function(e){
  if(e.target.matches('[data-file-input]')){
    const id = e.target.id;
    const f = e.target.files && e.target.files[0];
    window.uploadedFiles[id] = f ? f.name : "";
    const span = document.querySelector(`[data-file-name="${id}"]`);
    if(span) span.textContent = f ? f.name : "اختر ملف PDF أو صورة";
  }
});

/* Traveler count change → re-render the traveler blocks (structural change) */
document.addEventListener('change', function(e){
  if(e.target.matches('[data-draft-count]')){
    collectBookingDraftFromDOM();
    let v = parseInt(e.target.value, 10);
    if(isNaN(v) || v<1) v = 1;
    if(v>9) v = 9;
    requestDraft.travelerCount = v;
    route();
  }
});

/* Live age-tag update on birth-date entry, without a full re-render (keeps focus/typed values intact) */
document.addEventListener('input', function(e){
  if(e.target.matches('[data-trav-dob]')){
    const idx = e.target.getAttribute('data-trav-dob');
    const tag = document.querySelector(`[data-age-tag="${idx}"]`);
    if(tag){
      const cat = ageCategory(e.target.value);
      tag.textContent = cat ? cat.label : 'أدخل تاريخ الميلاد';
      tag.classList.toggle('is-set', !!cat);
    }
  }
  if(e.target.matches('[data-lic-dob]')){
    const tag = document.querySelector('[data-lic-age-tag]');
    if(tag){
      tag.textContent = licenseAgeNote(e.target.value);
      tag.classList.toggle('is-set', computeYearsOld(e.target.value)>=18);
    }
  }
});
